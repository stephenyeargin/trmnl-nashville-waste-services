---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: node
polling_url: 'https://api.recollect.net/api/places/{{ place_id }}/services/1263/events?nomerge=1&hide=reminder_only&after={{ "now" | date: "%s" | plus: trmnl.user.utc_offset | date: "%Y-%m-%d" }}&before={{ "now" | date: "%s" | plus: trmnl.user.utc_offset | plus: 2592000 | date: "%Y-%m-%d" }}&locale=en'
polling_headers: user-agent=TRMNL-Nashville-Waste/1.0
polling_body: ''
id: 240532
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  category: life,environment
  description: Show the next pickup date for Nashville Waste Services. Forked from <a href="https://github.com/hossain-khan/trmnl-next-pickup-plugin" class="underline">Hossain Khan's Next Pickup Plugin</a>
  github_url: https://github.com/stephenyeargin/trmnl-nashville-waste-services
  email_address: stephen@yearg.in
  learn_more_url: https://www.nashville.gov/departments/waste-services/trash-and-recycling-services/recycling-app
- keyname: place_id
  field_type: string
  name: Place ID
  description: Your unique location ID from Recollect. Look at the <a href="https://www.nashville.gov/departments/waste-services/trash-and-recycling-services/recycling-app">URL for exporting an ICS calendar</a>.
  placeholder: 918DB048-D91A-11E8-B83E-68F5AF88FEB0
name: Nashville Waste Collection
description: Upcoming trash & recycling pickup
refresh_interval: 720
